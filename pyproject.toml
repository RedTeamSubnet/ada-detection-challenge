[build-system]
requires = ["setuptools>=70.3.0,<83.0.0", "setuptools-scm>=8.0.4,<10.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ada_challenge"
authors = [{ name = "RedTeam Subnet", email = "noreply@theredteam.io" }]
description = "RedTeam Subnet's anti-detect browser detection (ADA-3) challenge."
readme = "README.md"
requires-python = ">=3.10,<4.0"
keywords = [
	"ada_challenge",
	"bittensor",
	"redteam",
	"subnet",
	"challenge",
	"anti-detect",
	"browser-detection",
]
license-files = ["LICEN[CS]E*"]
classifiers = [
	"Development Status :: 4 - Beta",
	"Intended Audience :: Developers",
	"Topic :: Software Development :: Libraries",
	"Operating System :: OS Independent",
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Programming Language :: Python :: 3.13",
]
dynamic = ["version", "dependencies", "optional-dependencies"]

# [tool.setuptools.packages.find]
# where = ["src"]
# include = ["ada_challenge*"]
# namespaces = false

[tool.setuptools.dynamic]
version = { attr = "ada_challenge.__version__.__version__" }
dependencies = { file = "./requirements.txt" }

[tool.setuptools.dynamic.optional-dependencies]
# Options dependencies for DEVELOPMENT
test = { file = ["./requirements/requirements.test.txt"] }
build = { file = ["./requirements/requirements.build.txt"] }
redteam = { file = ["./requirements/requirements.redteam.txt"] }
api = { file = ["./src/ada_challenge/challenge/requirements.txt"] }
dev = { file = [
	"./requirements/requirements.test.txt",
	"./requirements/requirements.build.txt",
	"./requirements/requirements.dev.txt",
	# "./requirements/requirements.redteam.txt",
	"./src/ada_challenge/challenge/requirements.txt",
] }

# [tool.pyright]
# venvPath = "."
# venv = ".venv"

[project.urls]
Homepage = "https://github.com/RedTeamSubnet/ada-detection-challenge"
Documentation = "https://docs.theredteam.io"
Repository = "https://github.com/RedTeamSubnet/ada-detection-challenge.git"
Issues = "https://github.com/RedTeamSubnet/ada-detection-challenge/issues"
Changelog = "https://github.com/RedTeamSubnet/ada-detection-challenge/blob/main/CHANGELOG.md"
